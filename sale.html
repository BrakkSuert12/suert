<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2016 Product Sale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.1/dist/leaflet.markercluster.js"></script>
    
    <link rel="stylesheet" href="sale.css?v=1.0.1">
</head>

<body class="bg-gray-100">

    <div id="notification" class="px-6 py-4 rounded-lg text-white font-medium z-50"></div>

    <div id="login-view" class="view min-h-screen flex items-center justify-center bg-gray-100 p-4">
        <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">2016 Product Sale</h2>
            <p class="text-center text-gray-500 mb-6">សូមស្វាគមន៍! សូមចូលគណនីរបស់អ្នក</p>
            <form id="login-form">
                <div class="mb-4">
                    <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">អ៊ីមែល</label>
                    <input type="email" id="login-email" class="w-full px-4 py-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">ពាក្យសម្ងាត់</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 border rounded-lg" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">ចូល</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">មិនទាន់មានគណនី? <a href="#" id="show-signup" class="font-medium text-indigo-600 hover:text-indigo-500">ចុះឈ្មោះនៅទីនេះ</a></p>
        </div>
    </div>
    
    <div id="signup-view" class="view min-h-screen flex items-center justify-center bg-gray-100 p-4">
        <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">បង្កើតគណនីថ្មី</h2>
            <form id="signup-form" class="space-y-3">
                <input type="text" id="signup-name" class="w-full px-4 py-2 border rounded-lg" placeholder="ឈ្មោះពេញ" required>
                <input type="tel" id="signup-phone" class="w-full px-4 py-2 border rounded-lg" placeholder="លេខទូរស័ព្ទ" required>
                <select id="signup-province" class="w-full px-4 py-2 border rounded-lg bg-white" required>
                    <option value="" disabled selected>-- កំពុងទាញយកតំបន់... --</option>
                </select>
                <input type="email" id="signup-email" class="w-full px-4 py-2 border rounded-lg" placeholder="អ៊ីមែល" required>
                <input type="password" id="signup-password" class="w-full px-4 py-2 border rounded-lg" placeholder="ពាក្យសម្ងាត់" required>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">ចុះឈ្មោះ</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">មានគណនីរួចហើយ? <a href="#" id="show-login" class="font-medium text-indigo-600 hover:text-indigo-500">ចូលគណនីវិញ</a></p>
        </div>
    </div>

    <div id="loading-view" class="view min-h-screen flex items-center justify-center">
        <p class="text-lg font-semibold animate-pulse">កំពុងដំណើរការ...</p>
    </div>

    <div id="main-app-view" class="view">
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-indigo-700">2016 Product Sale</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <p id="employee-name" class="font-semibold text-gray-800"></p>
                        <p id="employee-phone" class="text-sm text-gray-500"></p>
                        <p id="employee-province" class="text-xs text-gray-500"></p>
                    </div>
                    <button id="logout-btn" class="bg-red-500 text-white px-3 py-1.5 rounded-lg hover:bg-red-600 transition duration-200 text-sm">ចាកចេញ</button>
                </div>
            </div>
        </header>
        <div class="bg-white border-b border-gray-200 sticky top-[68px] z-10">
            <div class="container mx-auto px-4 py-2">
                <nav class="flex space-x-2 overflow-x-auto pb-2 -mb-2">
                    <button class="tab-btn active flex-shrink-0 flex items-center space-x-2" data-tab="sales"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7H12v-2a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2H2z"/></svg><span>ផ្ទាំងលក់</span></button>
                    <button class="tab-btn flex-shrink-0 flex items-center space-x-2" data-tab="operations"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M13 3v18h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-5Z"/><path d="M13 7h5"/><path d="M13 12h5"/><path d="M13 17h5"/></svg><span>ការងារ</span></button>
                    <button class="tab-btn flex-shrink-0 flex items-center space-x-2" data-tab="map"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>ផែនទី</span></button>
                    <button class="tab-btn flex-shrink-0 flex items-center space-x-2" data-tab="depots"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16"/><path d="m2 10 10-9 10 9"/><path d="M3 10v12h5v-8h8v8h5V10Z"/></svg><span>ដេប៉ូ</span></button>
                    <button class="tab-btn flex-shrink-0 flex items-center space-x-2" data-tab="report"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17v-6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v6"/><path d="M13 5v4"/><path d="M8 5v2"/><path d="M18 5v4"/></svg><span>របាយការណ៍</span></button>
                </nav>
            </div>
        </div>
        <div id="selected-depot-bar" class="hidden bg-indigo-600 text-white sticky top-[124px] z-10">
            <div class="container mx-auto px-4 py-2 flex justify-between items-center text-sm">
                <p>កំពុងលក់ឲ្យ៖ <strong id="selected-depot-name"></strong></p>
                <div class="flex items-center space-x-2">
                    <button id="damaged-exchange-btn" class="bg-orange-500 text-white px-3 py-1 rounded-md font-semibold hover:bg-orange-400">ប្តូរកាវខូច</button>
                    <button id="could-not-sell-btn" class="bg-yellow-500 text-black px-3 py-1 rounded-md font-semibold hover:bg-yellow-400">លក់មិនបាន</button>
                    <button id="clear-depot-btn" class="font-bold">&times; បោះបង់</button>
                </div>
            </div>
        </div>
        <main class="container mx-auto p-4 sm:p-6">
            <div id="sales-content" class="tab-content"></div>
            <div id="operations-content" class="tab-content hidden"></div>
            <div id="map-content" class="tab-content hidden"></div>
            <div id="depots-content" class="tab-content hidden"></div>
            <div id="report-content" class="tab-content hidden"></div>
        </main>
    </div>
    <div id="universal-modal" class="modal fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-40 hidden">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-lg transform transition-all"></div>
    </div>

    <script type="module" src="sale.js?v=1.0.1"></script>

</body>
</html>
